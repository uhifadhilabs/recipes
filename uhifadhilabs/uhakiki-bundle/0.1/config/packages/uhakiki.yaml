# Uhakiki — blind-consensus verification campaigns.
# Full reference: vendor/uhifadhilabs/uhakiki-bundle/docs/configuration.md
# or bin/console config:dump-reference uhakiki
uhakiki:
    # Official Google Map Tiles API (maps) + Static Maps (thumbnails).
    # Empty/unset = keyless satellite tile fallback.
    google_maps_api_key: '%env(UHIFADHI_GOOGLE_MAPS_API_KEY)%'
    campaigns: []
        # Example (synthetic domain):
        # water_points:
        #     subject: Water point
        #     plate_radius_m: 500          # pan bound of the review plate
        #     required_verdicts: 2         # blind verdicts to settle
        #     relocation_tolerance_m: 30   # agreeing relocations must land this close
        #     snap_radius_m: 30            # closer points are the same feature
        #     taxonomy:
        #         confirm: { label: Water point, children: [in use, abandoned] }
        #         reject:  { label: Not a water point, children: [rock outcrop, building] }

# Dev-only tooling (uhakiki:seed:*) is registered only outside production —
# same shape as framework.test being flipped on by when@test.
when@dev:
    uhakiki:
        dev_tools: true

when@test:
    uhakiki:
        dev_tools: true
