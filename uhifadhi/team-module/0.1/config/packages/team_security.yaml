# Security, wired to uhifadhi/team-module — written by its recipe, OWNED BY YOU.
#
# WHY A BUNDLE WROTE YOUR SECURITY CONFIG AT ALL. Firewalls and access_control
# are application configuration by Symfony's own design: only this project knows
# which of its paths are public. A bundle cannot decide that, and one that tried
# would be a bundle every installation had to fight. What a bundle CAN do is
# hand you a correct starting point wired to the identity it ships. That is this
# file. There is no separate security module and there is nothing for one to
# hold.
#
# WHY IT IS NOT `security.yaml`, WHICH IS WHERE YOU EXPECT IT. That filename
# already belongs to symfony/security-bundle's own recipe, and Symfony Flex
# refuses to let one recipe overwrite another recipe's file — silently on
# install, and even under `composer recipes:install … --force`. A recipe that
# shipped `security.yaml` would therefore ship nothing at all: you would install
# team-module, get the stock in-memory provider, and find out at your first
# sign-in attempt. So the settings arrive in a file of their own.
#
# HOW THE TWO FILES ADD UP. Symfony loads every `config/packages/*.yaml` and
# merges them into one `security` configuration, in filename order — so this
# file is read AFTER `security.yaml` and wins wherever the two disagree. What
# that means concretely:
#
#   * `firewalls.main.provider` here replaces the stock `users_in_memory`.
#   * `providers.users_in_memory` in security.yaml is now unused. Delete it, and
#     with it the comment above it — it is the stock placeholder for an
#     application that has no user storage, and you have one.
#   * everything else in security.yaml (the `dev` firewall, the hasher, the
#     when@test cost floor) is still yours and still applies.
#
# You may of course move all of this into `security.yaml` by hand and delete
# this file. Nothing in the module reads the filename; what the module depends
# on is only:
#
#   1. a provider that resolves Uhifadhi\Team\Entity\User, and
#   2. the route names `team_login` / `team_logout` (config/routes/team.yaml).
#
# Break either and the container says so at compile time rather than at 3am.
security:
    # The staff accounts, looked up by email. `property: email` is what makes
    # `_username` on the sign-in form an email address; the module also stores a
    # `ranger_code` for the field app, which is a DIFFERENT identifier resolved
    # by whatever API uses it, not by this provider.
    providers:
        team_user_provider:
            entity:
                class: Uhifadhi\Team\Entity\User
                property: email

    firewalls:
        main:
            # Replaces the stock `users_in_memory` (see the header).
            provider: team_user_provider

            # THE AUTHENTICATION ITSELF, and it is not in any controller: this
            # key is what intercepts the POST to /login. Both paths are the same
            # route, which is what makes a failed sign-in re-render the form
            # with its error rather than bouncing through a second URL. The
            # field names the module's template uses (`_username`, `_password`,
            # `_csrf_token`) are this key's defaults.
            form_login:
                login_path: team_login
                check_path: team_login
                enable_csrf: true
                # Where a FRESH sign-in lands — as distinct from team.yaml's
                # `after_sign_in_path`, which only covers somebody already
                # signed in who asks for /login again. Point this at your home
                # screen the day you have one.
                default_target_path: '/'

            # The checkbox on the sign-in card is wired to this. Delete the key
            # and the box is simply ignored — the card still works.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # one week
                always_remember_me: false

            logout:
                path: team_logout
                target: team_login

            # Super Admin impersonation. The tier grants ROLE_ALLOWED_TO_SWITCH
            # (see the hierarchy below), so no other tier can reach it.
            switch_user: true

            # BLUNTING CREDENTIAL STUFFING — commented out because it needs a
            # package this installation may not have. Run
            # `composer require symfony/rate-limiter` and uncomment; five
            # attempts a minute per IP is the module's recommendation.
            #login_throttling:
            #    max_attempts: 5

    # THE TIER LADDER, and it is not a permission tree. Admin and above hold the
    # two umbrella capability roles; Manager grants NO umbrella by tier, because
    # a Manager's capabilities come from their assigned position exactly as a
    # Staff user's do. The granular leaves (area.create, module.view, …) are
    # never listed here — they are decided by the module's voter.
    #
    # THERE ARE TWO UMBRELLAS AND THERE IS NO ROLE_INGESTION. If you are looking
    # at an older installation that has one, delete it: the permission it
    # covered is gone from the catalogue, so the role guards nothing.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_MANAGER, ROLE_AREAS, ROLE_MODULES]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    # ONLY THE FIRST MATCHING RULE APPLIES.
    #
    # THIS LADDER IS DELIBERATELY OPEN, and it is the first thing you should
    # change. A recipe that shut an installation's front door would lock every
    # existing page of every module already installed, on the `composer require`
    # that added identity — so the rule shipped here is the one that changes
    # nothing: /login is public, and everything else stays exactly as reachable
    # as it was before this bundle arrived.
    #
    # Closing it is one line, and the commented block below is the shape most
    # deployments end up with.
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        #- { path: ^/areas, roles: ROLE_AREAS }      # the umbrella; the verb is the voter's
        #- { path: ^/, roles: ROLE_USER }            # sign in to see anything at all
